# The admin credentials will be generated from this secret.
# Once the MongoDBUser is created, this secret is no longer required.
---
apiVersion: v1
kind: Secret
metadata:
  name: mas-mongo-admin-password
  namespace: "{{ mongodb_namespace }}"
type: Opaque
stringData:
  username: admin
  password: "{{ lookup('password', '/tmp/mck-mongo-admin-password.txt chars=ascii_letters,digits length=16') }}"
